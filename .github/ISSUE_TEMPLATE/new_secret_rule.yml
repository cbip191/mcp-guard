name: New Secret or PII Rule
description: Request or propose a new deterministic detector for src/redact.mjs
labels: ["enhancement", "security"]
body:
  - type: input
    id: provider
    attributes:
      label: Provider / Token Type
      placeholder: "e.g. Linear API Key (lin_api_...)"
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: Official Token Format & Prefix
      description: Document prefix, character set, length, and link to vendor docs. Does it require keyword context gating?
    validations:
      required: true
  - type: textarea
    id: false_positives
    attributes:
      label: False-Positive Considerations
      description: Provide benign engineering strings (IDs, hashes, versions, URLs) that must NOT match this rule.
    validations:
      required: true
