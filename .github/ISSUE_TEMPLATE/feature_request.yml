name: Feature Request
description: Propose a new capability, MCP transport, or policy improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What real MCP security or developer-experience gap does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the CLI flag, policy schema, or API behavior (remember our zero-dependency rule).
    validations:
      required: true
